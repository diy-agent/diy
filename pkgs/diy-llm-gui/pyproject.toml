[project]
name = "diy-llm-gui"
version = "0.1.0"
description = "diy-llm PySide6 系统托盘管理程序"
requires-python = ">=3.12"
dependencies = [
    "diy-llm",
    "pyside6==6.8.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
diy-llm-gui = "diy_llm_gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/diy_llm_gui"]

[tool.uv.sources]
diy-llm = { workspace = true }
