[project]
name = "diy-clirpc"
version = "0.1.0"
description = "CLI-as-API via ConnectRPC / HTTP/2 — 协议研究"
requires-python = ">=3.12"
dependencies = [
    "connectrpc>=0.11.0",
    "protobuf-py>=0.1.1",
    "starlette>=0.40",
    "uvicorn[standard]>=0.34",
    "h2>=4.0",
    "hypercorn[h2]>=0.18.0",
    "httpx[http2]>=0.28.1",
    "cyclopts>=3.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_rpc"]
