# ============================================================
# Provider Type: tencentcloud-tokenhub
# 腾讯云 TokenHub API (tokenhub.tencentmaas.com)
# ============================================================

# 🔗 参考文档
#   模型价格: https://cloud.tencent.com/document/product/1823/130055
#   模型列表: https://cloud.tencent.com/document/product/1823/129605

type: tencentcloud-tokenhub
name: 腾讯云 TokenHub

# 🔐 认证方式 —— 固定 api_key
auth:
  scheme: api_key
  header: Authorization
  prefix: "Bearer "

# 🌐 API 协议
api:
  protocol: openai-compatible
  default_base: https://tokenhub.tencentmaas.com/v1
