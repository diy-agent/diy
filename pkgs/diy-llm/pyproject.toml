[project]
name = "diy-llm"
version = "0.1.0"
description = "diy-llm - Tencent Cloud LLM via LiteLLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.0.0",
    "cyclopts>=3.0",
]

[project.scripts]
diy-llm = "diy_llm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diy_llm"]

[tool.hatch.build.targets.sdist]
include = [
    { path = "src/diy_llm/providers/*.yaml", format = "wheel" },
]

[tool.uv]
package = true
