# ============================================================
# Provider: deepseek
# DeepSeek 官方 API (api.deepseek.com)
# ============================================================

type: deepseek
label: DeepSeek 官方

# 🔐 认证方式 —— 固定 api_key
auth:
  scheme: api_key
  header: Authorization
  prefix: "Bearer "

# 🌐 API 协议
api:
  protocol: openai-compatible
  default_base: https://api.deepseek.com

# ── 模型白名单（只暴露这里声明的模型） ──────────────────

models:
  deepseek-v4-pro:
    label: DeepSeek V4 Pro
    reasoning: true
    context_window: 1000000
    max_tokens: 384000
    cost: {input: 1.74, output: 3.48, cacheRead: 0.145, cacheWrite: 0}
    compat:
      requiresReasoningContentOnAssistantMessages: true
      thinkingFormat: deepseek
      reasoningEffortMap:
        minimal: high
        low: high
        medium: high
        high: high
        xhigh: max

  deepseek-v4-flash:
    label: DeepSeek V4 Flash
    reasoning: true
    context_window: 1000000
    max_tokens: 384000
    cost: {input: 0.14, output: 0.28, cacheRead: 0.028, cacheWrite: 0}
    compat:
      requiresReasoningContentOnAssistantMessages: true
      thinkingFormat: deepseek
      reasoningEffortMap:
        minimal: high
        low: high
        medium: high
        high: high
        xhigh: max
