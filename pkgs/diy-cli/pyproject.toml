[project]
name = "diy-cli"
version = "0.1.21" # x-release-please-version
description = "diy 统一入口 (Python 移植版)"
requires-python = ">=3.12"
dependencies = [
    "diy-core",
    "cyclopts>=3.0",
    "rich>=13.0",
    "PyYAML>=6.0",
    "json5>=0.10",
    "httpx",
    "fastapi>=0.138.1",
    "uvicorn>=0.48.0",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
diy = "diy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diy"]

[tool.uv]
package = true
