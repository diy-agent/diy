[project]
name = "diy-app"
version = "0.1.0"
description = "diy 管控台 — PySide6 桌面 app"
requires-python = ">=3.12"
dependencies = [
    "diy-core",
    "PySide6>=6.8,<6.9",
    "cyclopts>=3.0",
    "rich>=13.0",
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn>=0.48",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diy"]

[tool.uv]
package = true
