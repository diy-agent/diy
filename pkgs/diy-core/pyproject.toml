[project]
name = "diy-core"
version = "0.1.0"
description = "diy 核心逻辑 — state 管理、agent 后端、任务模型"
requires-python = ">=3.12"
dependencies = [
    "cyclopts>=3.0",
    "rich>=13.0",
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diy"]

[tool.uv]
package = true
