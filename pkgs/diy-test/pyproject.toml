[project]
name = "diy-test"
version = "0.1.0"
description = "diy 测试基础设施 — ShellTest, assert_intent 共享引擎"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diy"]

[tool.uv]
package = true
