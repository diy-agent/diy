[project]
name = "diyui"
version = "0.1.20" # x-release-please-version
description = "diyui - A thin reactive wrapper over UI frameworks."
requires-python = ">=3.12"
dependencies = [
    "panel>=1.9.1",
    "asyncio>=4.0.0",
    "param>=2.3.3",
]

[dependency-groups]
dev = [
    "marimo>=0.23.2",
    "playwright>=1.57.0",
    "pytest-playwright>=0.7.0",
    "pip>=25.3",
    "cyclopts>=4.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diyui"]

[tool.uv]
package = true

# ========== Marimo 配置 ==========
[tool.marimo.runtime]
# auto_instantiate = true
show_tracebacks = true
