[project]
name = "diydev"
version = "0.1.10" # x-release-please-version
description = "diy 开发流程 CLI - issue 与 worktree 统一管理"
dependencies = [
    "cyclopts>=3.0",
    "rich>=13.0",
]

[project.scripts]
dev = "diydev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diydev"]
