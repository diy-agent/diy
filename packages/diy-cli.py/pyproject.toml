[project]
name = "diy-cli"
version = "0.1.0"
description = "diy 统一入口 (Python 移植版)"
requires-python = ">=3.12"
dependencies = [
    "cyclopts>=3.0",
    "rich>=13.0",
    "PyYAML>=6.0",
    "json5>=0.10",
]

[project.scripts]
diy = "diycli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diycli"]

[tool.uv]
package = true
