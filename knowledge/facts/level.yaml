  level#expose:
    value: |-
      UI 暴露优先级 `E0`~`E3`（**信息摆多显眼**）：**E0** 抢注意力（焦点聚焦 / 拉回窗口 / 横幅）；**E1** 页面上直接可见（行内状态、常驻栏、条目）；**E2** hover / 点击弹出（简要 card、浮层）；**E3** 进新页面才看得到。
    id: agents.level.expose
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: ~/AGENTS.md:62
      verifiedAt: '2026-10-22'
  level#inbox:
    value: |-
      **`N1` / `N2` 一律落「通知信箱」**（右上角，可回看、可计数 `+1`）：toast 会消失，**信箱不丢** —— 「我刚才错过了什么」的唯一答案在信箱里，不在 toast 的历史里。⚠️ 机制未实现，缺口记录见 `pkgs.ts/diy-app/AGENTS.md::tool.wake-gap`。
    id: agents.level.inbox
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: ~/AGENTS.md:65
      verifiedAt: '2026-10-22'
  level#notice:
    value: |-
      提示优先级 `N0`~`N3`（**怎么打扰人**）：**N0** 强干预（窗口取焦点 / 会话拉回 / 横幅告警）；**N1** toast（不要求立刻处理，**必须配 N2 兜底**，不许只闪一下）；**N2** 页面顶栏图标 / 角标（未读、运行中 session）；**N3** 极小指示（一个点、内部标签），不打扰。
    id: agents.level.notice
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: ~/AGENTS.md:63
      verifiedAt: '2026-10-22'
  level#priority:
    value: |-
      任务优先级 `P0`~`P3`：**P0** 立刻停手（数据危险 / 阻塞全员）；**P1** 本轮做；**P2** 排期做；**P3** 备忘（有清晰对错才立项，否则进候选池）。
    id: agents.level.priority
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: ~/AGENTS.md:61
      verifiedAt: '2026-10-22'
  level#rule:
    value: |-
      **一把尺子量三种「重要程度」**：任务优先级 / UI 暴露 / 提示叫醒，全部 0 最高、数字越大越弱。新加任何「重要程度」字段先选现成一套对齐，**不许自造量纲**（`high` / `critical` / `1 高` / `5 高` 混用一锅）。
    id: agents.level.rule
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: ~/AGENTS.md:60
