  flow.params#param-no-shape:
    value: |-
      **参数只改值、不改形**：不许增删节点 / 边；「本次跳过某步」= 参数让 `guard` / 边上的 `when` 短路（##311 §二）
    id: flow.param-no-shape
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: 25da9072:pkgs.ts/diy-flow/AGENTS.md:63
  flow.params#param-scope:
    value: |-
      **参数声明在节点上**（`NodeDef.params`，L1 代码）：局部名 + `type` + `default`（必填）；全限定名 = `节点 id.局部名`，实例值是同构嵌套 `{ 节点 id: { 局部名: 值 } }`；局部名与「声明了参数的节点 id」都不许含 `.`
    id: flow.param-scope
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: 25da9072:pkgs.ts/diy-flow/AGENTS.md:60
  flow.params#param-types:
    value: |-
      类型全集 `string | number | boolean | enum | list` **只收引擎画得出控件的**（不支持嵌套对象）；`list` 只装标量；约束 `enum?`（仅 enum）/ `min?` `max?` `unit?`（仅 number），写错类型即 `invalid-def`
    id: flow.param-types
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: 25da9072:pkgs.ts/diy-flow/AGENTS.md:61
  flow.params#param-value:
    value: |-
      实例值必须**纯 JSON**（标量 / 标量列表、有限数）；非法值 `invalid-param`、未知节点 / 未知参数名 `unknown-param`，**绝不静默忽略**；`resolveParams` 结果全量 + 冻结
    id: flow.param-value
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: 25da9072:pkgs.ts/diy-flow/AGENTS.md:62
  flow.params#params-in-state:
    value: |-
      **`params` 值属领域状态**（##311 §二 L3 / ##333 交付 G）：`createRuntime` 把本次用的那份写进产出的 `FlowState.params`（`commit` 随 `AdvanceRequest.params` 交下去；两条 `done` 返回原地加标记、由 `stampParams` 补）。**`advance` 自己也能收 `params`**（纯透传、不改不冻结、不校验值语义）：给了就用本次的、没给就继承入参那份 —— 正路闭环，见 `rule.domain-first`。三条不变量：① 状态带着**另一份**参数值（键序无关比较）⇒ 拒（`invalid-param @ state.params`）；② 状态**已进入却没记参数值**（`position !== null` 且 `params === undefined`，本次运行有参数值）⇒ 拒 —— **「缺省」≠「丢了」**，唯一放行的是尚未进入（`initialState()` 本就不带 `params`，那是另起一次运行的正路；消息里给修法）；③ **`advance` 请求带的参数值与状态里那份不一致** ⇒ 拒（`invalid-param @ request.params`）—— 折线上早先的驻留是拿旧配置跑的，换掉即混配状态、且落盘把旧值抹掉（事后无从发现）；**runtime 与正路同一条口径**（runtime 拒、正路也拒）。值的**语义**校验归 ##316，本包不重写
    id: flow.params-in-state
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: 25da9072:pkgs.ts/diy-flow/AGENTS.md:38
  flow.plugin#compose-order:
    value: |-
      **先注册齐、再 `createRuntime`**（组合期扫描要求名字此刻已注册；`prompt:` 不查）。界线 = **内核只校验自己 `resolve` 的槽**（`guard`/`action`/`notify`）；`render`/`source` 的名字**不查**
    id: flow.compose-order
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: 25da9072:pkgs.ts/diy-flow/AGENTS.md:55
  flow.plugin#notify-bypass:
    value: |-
      `notify` 是**旁路**：插件抛错 / 回执形状错只记进 `transition.notifyErrors`，**不作废**已落定的 `state` / `event`；插件异常统一包成 `plugin-threw`（带 `cause`）
    id: flow.notify-bypass
    review: accepted
    lifecycle: active
