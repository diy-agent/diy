domain: rpc
facts:
  rpc.find#cli:
    value: '`src/cli/` CLI 桥：`_parser.ts` 在**调用方**进程读 stdin / `*-file` 选项（handler 跑在被调的 app 进程，fd 0 与 cwd 都不是调用方的）'
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: e05fa9c3:pkgs.ts/diy-rpc/AGENTS.md:10
      verifiedAt: '2026-10-23'
  rpc.find#core:
    value: '`src/core/` 平台无关核：`rpc.ts`（声明式 RPC + `router()` / `createHandler()` / `createClient()`）· `meta.ts`（过程元数据 + zod 桥）· `server-binding.ts` / `channel-client-binding.ts` / `channel-server-binding.ts` / `server-binding-core.ts`（绑定层）· `typed-client.ts` · `mem.ts`（内存传输对）· `error.ts` · `types.ts`（`Envelope` 信封）· `_tree.ts` / `_async-queue.ts` / `_cli-meta.ts`（内部原语）'
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: e05fa9c3:pkgs.ts/diy-rpc/AGENTS.md:8
      verifiedAt: '2026-10-23'
  rpc.find#entry:
    value: '`src/index.ts` 根入口（副作用加载 `core/_cli-meta` 的 zod 补丁，再全量 re-export `core`）；子路径入口见 `package.json` 的 `exports`：`./http` `./ws` `./electron` `./cli`'
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: e05fa9c3:pkgs.ts/diy-rpc/AGENTS.md:7
      verifiedAt: '2026-10-23'
  rpc.find#publish:
    value: 发布形态：`tsconfig.build.json`（NodeNext + emit 到 `dist/`）· 分发脚本 `scripts/npm-publish.mjs`
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: e05fa9c3:pkgs.ts/diy-rpc/AGENTS.md:11
      verifiedAt: '2026-10-23'
  rpc.find#transport:
    value: '`src/transport/` 传输实现：`http/`（`node:http2`）· `ws/`（`ws` 包只在这里用到）· `electron/`（`ipcMain`/`ipcRenderer`）—— **三者都是宿主专属**，不是浏览器安全层（见 `rpc.rule#browser`）'
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: e05fa9c3:pkgs.ts/diy-rpc/AGENTS.md:9
      verifiedAt: '2026-10-23'
  rpc.rule#browser:
    value: '**内核必须浏览器安全，传输层不承诺**：`./sha.sh check-browser`（`tsc -p tsconfig.browser.json`）的 `include` 只有 `src/index.ts` + `src/core/**`，`exclude` 掉 `src/cli` 与 `src/transport/**` —— 所以**不要**以为 `./http` / `./electron` 也被这条检查覆盖：`http-client-binding.ts` 真 `import * as http2 from "node:http2"`、`electron/` 真 `import { ipcMain, ipcRenderer } from "electron"`。判据一句话：**Node 特有 API 只准出现在 `src/transport/**` 与 `src/cli/**`，`src/core/**` 一律不许**'
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: e05fa9c3:pkgs.ts/diy-rpc/tsconfig.browser.json:9
      verifiedAt: '2026-10-23'
  rpc.rule#esm-ext:
    value: '源码内相对 import/export **必须带 `.js` 扩展名**（指向 `.ts`）：发布构建是 `module: NodeNext`，要求显式扩展名；vite/vitest 会把它映回 `.ts`'
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: e05fa9c3:pkgs.ts/diy-rpc/AGENTS.md:15
      verifiedAt: '2026-10-23'
  rpc.rule#publish-flow:
    value: 发布**只走** `./sha.sh publish`（= `tsc -p tsconfig.build.json` + `scripts/npm-publish.mjs`，后者在 `dist/` 生成发行版 package.json 再 `npm publish dist`）。仓内 `package.json` 的 `main`/`exports` 恒指 `src/*.ts` 且留 `private:true`（防手滑护栏）—— **发行 exports 由仓内 exports 推导**，新增子路径入口自动带上，别在脚本里另写一份清单
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: e05fa9c3:pkgs.ts/diy-rpc/AGENTS.md:17
      verifiedAt: '2026-10-23'
