  facts.rule#tasklib-inherit:
    value: 任务级库**继承**仓库词表，且**写回只写本地的**：`loadRepo` 把「全量词表」与「本地声明的词表」分成两份（`subjects` / `localSubjects`），写回用后者 —— 混用会让第一次 `submit` 就把继承的整份词表复制成本地快照。⚠️ **继承只持续到本地文件诞生**：任务库首次写入就建出本地 `subjects.yaml`，继承当场断掉、此后**不再合并**仓库词表 ⇒ 任务库词表不是「仓库 ∪ 本地」的持续快照，别按那个前提设计
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: cf38b8ab:pkgs.ts/diy-facts/AGENTS.md:28
      verifiedAt: '2026-10-22'
  facts.rule#tasklib-root:
