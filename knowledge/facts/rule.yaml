      verifiedAt: '2026-10-22'
  rule#atomic-task:
    value: '**任务是原子开发单元**：建任务的前提是它能**独立开发 + 独立 merge 回 main 且 main 仍可用（可编译、可验收）**。做不到（改动与别的任务共用同一处代码、merge 后 main 半截）即切分错了 → 要么重划边界，要么并成一个任务一次性成型。**先后顺序靠排序表达，不靠拆任务。**'
    id: agents.rule.atomic-task
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: ~/AGENTS.md:16
      verifiedAt: '2026-10-22'
  rule#check:
    value: '**类型检查只准 `./sha.sh check`**。各包 `noEmit:true`；一旦 emit，产物落在源码旁会被 `resolve.extensions` 优先命中（症状：改了没反应）'
    id: agents.rule.check
    review: accepted
    lifecycle: active
    evidence:
      source: user
      verifiedAt: '2026-10-21'
  rule#core-log:
    value: '**核心逻辑不依赖日志**：模块的领域状态自成真源、可独立序列化落盘；日志（事件流）降为**审计/统计**材料，可清可丢、丢了不影响运行；进程内的 Event 只是模块间进度通知的消息。横向模块关联靠**显式 ref**（如 `turnId`/`stepId`），不靠共享日志。**历史转变**：早期把日志当投影真源（ops → historyMessages），致模块逻辑被日志绑死、难进化 → **新 module 一律按新思路设计，旧模块不追溯**。代表：##310 / ##311(工作流特性专项)。'
    id: agents.rule.core-log
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: ~/AGENTS.md:21
      verifiedAt: '2026-10-22'
  rule#dev-concurrent:
    value: '**同一 variant** 的 `lab` 运行中勿并发 `tsc -b` / `vite build` / 全量 vitest（抢同一 `outDir`，watcher 卡死）。跨 variant（lab vs test）各写 `build/<v>`，不抢'
    id: agents.rule.dev-concurrent
    review: accepted
    lifecycle: active
    evidence:
      source: user
      verifiedAt: '2026-10-21'
  rule#discriminated-union:
    value: '**判别联合（带判别键的对象）一律「判别键同级 = 公共字段；分支私有数据进 `data`」**：判别键默认 `type`（历史 `kind`/`op`/`mode`/`render` 不动），与 `type` 同级的字段 = **所有分支共有**；每个分支**私有**的数据一律放 `data`。**用统一 `data` 而非 `<判别键>Data`**：这样「任何类型化节点 = `{ type, 公共…, data }`」**自相似**——通用序列化/校验/UI 只认 `.data` 即可，不必先知道判别键名才能找到载荷。**嵌套同构**：子对象也是 `{ type, data }`，逐层递归（`data.data` 是不同深度，**不撞车**）。理由：① 读结构即知归属；② 私有字段平铺会与公共字段抢同级空间；③ 统一 `data` 使机器可泛化处理。历史形状（`mode`+`modeData` / `render`+`renderData`）保留不追溯。'
    id: agents.rule.discriminated-union
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: ~/AGENTS.md:20
      verifiedAt: '2026-10-22'
  rule#doc-format:
    value: 每条一行：`- \`<域>.<对象>.<方面>\` — 值`。key 全链唯一，同一事实只在最该负责的那层写一次（深层同名 key = 覆盖）。值超过一行说明它是细节 → 删掉，改成指向路径。
    id: agents.rule.doc-format
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: ~/AGENTS.md:12
      verifiedAt: '2026-10-22'
  rule#doc-fresh:
    value: '**AGENTS.md 是代码的信息投影，不是知识库**。只写「去哪找 / 用什么 / 硬约束 / 反直觉的坑」，不写易变细节（字段清单、UI 文案、实现步骤）。**代码大改后对应层必须整篇重写**，而不是打补丁 —— 投影腐坏比没有投影更糟。'
    id: agents.rule.doc-fresh
