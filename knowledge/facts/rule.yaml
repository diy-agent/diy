  rule#task-root-logical:
    value: '**逻辑根 ≠ 物理根**：任务树由 `parent` 字段表达，但**尚未打平** —— 有些任务物理上挂在**目录型容器**下（如 bug汇总 `##158(bug汇总)` → 归档 `##162(bug汇总归档（158 已修复项）)`；分配官 `##87(任务分配)`），**逻辑上仍是根任务**。判据看**职责不看挂点**：自成专项、养着子任务的就是逻辑根 → 按 `rule.task-owner` 办（不开发，只计划 / review / 排查 / 沟通）。临时安排，待树打平后自然消解。'
