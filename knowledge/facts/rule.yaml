      at: ~/AGENTS.md:19
      verifiedAt: '2026-10-22'
  rule#task-owner:
    value: '**父任务 / 根任务是其子任务的 owner，自身不写码**。owner 只做四件事：**计划**（拆子任务 / 排序 / 定边界）、**review**（子任务交付）、**排查**（追根因、定位到代码）、**沟通**（回用户、派活）。要写码 → **开子任务派出去**。owner 的产物是**任务 body**（台账 / 计划 / 订正 / review 记录），不是 diff。'
    id: agents.rule.task-owner
    review: accepted
    lifecycle: active
    evidence:
