# knowledge/facts/rule.yaml

# 生成物式的真源：整篇由 `diy facts submit` 写入（字段顺序、条目排序都由程序定）。
domain: rule
facts:
  - id: agents.rule.check
    subject: rule
    aspect: check
    value: '**类型检查只准 `./sha.sh check`**。各包 `noEmit:true`；一旦 emit，产物落在源码旁会被 `resolve.extensions` 优先命中（症状：改了没反应）'
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:68
      verifiedAt: '2026-10-21'
  - id: agents.rule.dev-concurrent
    subject: rule
    aspect: dev-concurrent
    value: '**同一 variant** 的 `lab` 运行中勿并发 `tsc -b` / `vite build` / 全量 vitest（抢同一 `outDir`，watcher 卡死）。跨 variant（lab vs test）各写 `build/<v>`，不抢'
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:70
      verifiedAt: '2026-10-21'
  - id: agents.rule.instance-lifecycle
    subject: rule
    aspect: instance-lifecycle
    value: '**实例起停权限与数据定性**：`test` / `lab` 由 agent **自由起停**（随便折腾，不用问；`lab` 同时是人机沟通·验证 UI 的入口 —— 原 `preview` 的职责已并入它）；二者数据皆**临时非生产**（仓库根 `build/<variant>/home`，坏了就清，必要时可重置）。**唯全局 `diy`（prod / `~/.diy`）是日常实跑的生产 app** —— 不动其数据根、不杀其进程，重启留给用户手动'
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:71
      verifiedAt: '2026-10-21'
  - id: agents.rule.lab-owner
    subject: rule
    aspect: lab-owner
    value: '**lab 一律开在「自己任务的 worktree」里**（`~/git/diy.worktrees/t<号>-*/` 内 `./sha.sh lab`；数据根随之隔离在该 worktree 的 `build/lab/home`）。**根 worktree（`~/git/diy/diy`）的 `build/lab/home` 是「无主」的** —— 只与用户联合使用（人在那儿看效果），**agent 不自己去开**：判别不了谁在用，撞 `SingletonLock` 或把种子 / 真配置写进用户正开着的根。要实验先给自己任务开 worktree'
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:72
      verifiedAt: '2026-10-21'
  - id: agents.rule.new-pkg
    subject: rule
    aspect: new-pkg
    value: 新增包检查单：`tsconfig.json`（composite + noEmit + include）+ `tsconfig.all.json` references
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:73
      verifiedAt: '2026-10-21'
  - id: agents.rule.probe
    subject: rule
    aspect: probe
    value: 轮次中勿改 `src/**` 当探针（watch 重启打断自己的轮次）；探针写 `/tmp`
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:69
      verifiedAt: '2026-10-21'
  - id: agents.rule.renderer
    subject: rule
    aspect: renderer
    value: UI 主线是 `renderer_solid/`（SolidJS）；React 版已删除
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:74
      verifiedAt: '2026-10-21'
  - id: agents.rule.task-write
    subject: rule
    aspect: task-write
    value: '**任务文件头是权威**（##322）：读侧 `task show` / `getTask` / 上下文 `task.*` 给的就是文件头 frontmatter **同一份**（确认任务不必 `cat` 任务文件）；写侧 `task edit` 的整篇覆盖 `--body <文本>` / `--body-text <文本>` / `--body-file <file|->` 与追加 `--append-body <file|->` / `--append-body-file <file|->` / `--append-body-text <文本>`（各**三选一**，多给即报错；`--body` 只收**内联正文** —— 值形如单行路径即**拒**并提示，##338）收到「整份文件」一律**剥头**（追加侧判据更严：须含 `state`/`created`/`updated`，故追加一份自带 front matter 的普通文档时其文档头**保留**），返回值回报剥掉的键与原文 —— 契约原文见 `diy task edit --help`（##338）；**同族同护栏**（##376）：`task create --body` / `task drafts set --body` 也挂 `inlineText`（镜像 `resolveBodyOverride`，逃生口 `--body-text` / `--body-file` 同样可用），差别只有 create **不剥头**（新建无头可覆盖，传整份文件会把头写进正文）'
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:75
      verifiedAt: '2026-10-21'
