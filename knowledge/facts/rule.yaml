  rule#task-artifacts:
    value: '**任务产物（工具 / demo / 文档等）落位**：**临时**的一律进系统临时目录（`/tmp`、`mktemp -d`），不落任务目录；**需长期参考**的进**任务目录** `$DIY_HOME/projects/<pid>/tasks/<tid>/gen/<类别>/`（`$DIY_HOME` = `~/.diy`；如 demo → `…/tasks/<tid>/gen/demo/<名>/`，**每个 demo 独占一目录**，别把多文件混作一堆 —— 一个目的常产多个文件）。⚠️ **是任务目录、不是 worktree 的 `./gen/`** —— agent 的 cwd = worktree，写相对路径 `./gen/` 会落进**产品仓**（禁止：产品仓只放产品资产，任务截图 / demo 不是）。**带时效**的（一版接一版，如 demo 迭代）目录名带「日期 + 序号 + 用途」；**长期事实**（不随时间变）**不加日期**。'
    id: agents.rule.task-artifacts
    review: accepted
    lifecycle: active
    evidence:
