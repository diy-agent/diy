    id: agents.rule.err-triage.defect
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: ~/AGENTS.md:24
      verifiedAt: '2026-10-22'
  rule.err-triage#evolve:
    value: 识别度**可演化且留痕**：`ENOSPC 裸抛 → unknown` → 人裁定「环境问题」→ 开任务识别并写话术 → 上线后 `recognized`；新埋点上线**不追溯**老 unknown（历史数据不重算）。**文案与判据分离**：判据归 `error-triage.ts`，文案归 `shared/turn-end.ts` / notice 出口，渲染层不许拼句子。
    id: agents.rule.err-triage.evolve
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: ~/AGENTS.md:28
      verifiedAt: '2026-10-22'
  rule.err-triage#recognized:
    value: '**已识别的外部问题不许当 bug**（当 bug 会让缺陷率失真、把用户训练成忽略红色）：额度 429 / 认证 401·403 / 磁盘满 ENOSPC·EDQUOT / 网络层错误码 ⇒ 固定话术 + 处置建议，不报 issue、不弹裁定，允许再现。入场门槛 = 说得出判据；**HTTP 5xx 与请求超时不算**（上游回了 HTTP 说明网络通着，那是服务端故障 ##369(模型不可用)）。'
    id: agents.rule.err-triage.recognized
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: ~/AGENTS.md:25
      verifiedAt: '2026-10-22'
  rule.err-triage#unknown:
    value: 未识别的外部只生成**本地草稿**：拿不到码就如实写「无法判定」，**不猜、不预设是 bug**；未知异常**永不自动上报**（正文可能含路径 / 日志片段，人确认后才出网），同类第二次经人裁定后升级为 defect / recognized（留痕在 `local/` 侧，刀 2）。
    id: agents.rule.err-triage.unknown
