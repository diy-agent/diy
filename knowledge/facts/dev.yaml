# knowledge/facts/dev.yaml — 开发流程纪律（判据 / 入口 / 硬要求）

# 生成物式的真源：整篇由 `diy facts submit` 写入（字段顺序、条目排序都由程序定）。
domain: dev
facts:
  dev.check#entry:
    value: ./sha.sh check = tsc -b 全仓 + oxlint + rpc 浏览器安全 + 产物/可执行位/原子写/异常码/规范索引 五道护栏
    id: dev.check
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: sha.sh:165
      verifiedAt: '2026-10-21'
  dev.commit#signing:
    value: 所有 git 操作必须 GPG 签名，失败即停并求助，禁 --no-gpg-sign
    id: dev.commit-sign
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: ~/git/diy/AGENTS.md:25
      verifiedAt: '2026-10-21'
  dev.setup#sync:
    value: 新 worktree 先 ./sha.sh sync（npm i --workspaces --include-workspace-root + 子模块 + 各包 sync）；只跑 --workspaces 会漏装根依赖，干净 worktree 上必现 build 解析失败
    id: dev.sync
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: docs/toolchain.md:32
      verifiedAt: '2026-10-21'
  dev.setup#task-write:
    value: 任务文件头是权威：读侧 task show 给的就是 frontmatter；--body 只收内联正文（值形如单行路径即拒），整篇文件走 --body-file / 追加走 --append-body-file
    id: dev.task-write
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: docs/task-write-contract.md:1
      verifiedAt: '2026-10-21'
  dev.test#bail:
    value: 红灯即停；回报如实写「跑到第一个失败为止：N files / M passed / 其余未跑」，不许报成全量通过
    scope:
      paths:
        - pkgs.ts/diy-app/tests
        - pkgs.ts/diy-facts/tests
    id: dev.test-bail
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: ~/AGENTS.md:68
      verifiedAt: '2026-10-21'
  dev.test#entry:
    value: ./sha.sh test-unit 快测（不起 Electron）· diy-app 意图测试 pkgs.ts/diy-app/sha.sh test-intent [片段]
    id: dev.test
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: sha.sh:89
      verifiedAt: '2026-10-21'
  dev.turn-interrupt#blind:
    value: 结局不可辨：interrupted.data 是空对象（local-blocks.ts:34），UI 一律显示「本轮未完成（流中断/崩溃恢复）」（turn-end.ts:55 / chat-fold.ts:232）—— 热重启 / 流断 / 进程被杀同形，人和 agent 都无法归因
    id: dev.turn-interrupt-blind
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: pkgs.ts/diy-app/src/main/services/local-blocks.ts:34
      verifiedAt: '2026-10-22'
  dev.turn-interrupt#cause:
    value: lab/dev 下「本轮未完成」的头号成因是 dev 热重启，不是服务器：main bundle 一变更 electron-dev.mts::startElectron 就 kill Electron，而轮次跑在 main 进程内存里 → 一起消失
    id: dev.turn-interrupt-cause
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: pkgs.ts/diy-app/scripts/electron-dev.mts:295
      verifiedAt: '2026-10-22'
  dev.turn-interrupt#rate:
    value: 实测 tasks/5 + tasks/7 共 37 个真发请求轮：HTTP 全 200；interrupted 12 起，12 起全部命中 electron-restart（末请求后 7.2~31.3s）；服务器侧成因 0 起，唯一 error 是流读 read ETIMEDOUT
    id: dev.turn-interrupt-rate
    review: accepted
    lifecycle: active
    evidence:
      source: probe
      probe: DIY_HOME=<lab home> uv run <lab home>/projects/1/tasks/7/gen/probe/interrupt-cause.py projects/1/tasks/5 projects/1/tasks/7
      verifiedAt: '2026-10-22'
  dev.worktree#location:
    value: 放仓库外、原项目同级：<原项目>.worktrees/<标识>（禁放仓库内部）
    id: dev.worktree
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: ~/git/AGENTS.md:17
      verifiedAt: '2026-10-21'
