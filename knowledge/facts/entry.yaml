# knowledge/facts/entry.yaml

# 生成物式的真源：整篇由 `diy facts submit` 写入（字段顺序、条目排序都由程序定）。
domain: entry
facts:
  entry#choose:
    value: '**先问「操作谁的数据」**：真实任务/项目/agent → 全局 `diy`；worktree 改码·跑测试 → `./diy.sh`；人看 UI 效果 / agent 实验 → `./sha.sh lab`。**别拿 `./diy.sh` 查生产任务**（数据根不同 → 报「任务 N 不存在」）'
    id: agents.entry.choose
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:24
      verifiedAt: '2026-10-21'
  entry#client:
    value: '`diy` / `./diy.sh` **都是客户端**（不启 GUI）：探 `$DIY_HOME/app.port` + 验身份，连不上才 spawn；**起 GUI 的是启动器 `./sha.sh lab`，只 spawn、从不连已跑实例**'
    id: agents.entry.client
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:26
      verifiedAt: '2026-10-21'
  entry#gui:
    value: 起 GUI 两条路：`./sha.sh lab`（HMR，免构建）或 `sha.sh build` 后由 CLI 拉起
    id: agents.entry.gui
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: docs/instance-modes.md:35
      verifiedAt: '2026-10-21'
  entry#home-guard:
    value: 「继承来的生产 `DIY_HOME` 一律拒绝」：判据 `core/instance-identity.ts::isProdDataHome`、回落 `core/dev-home.ts::resolveDevHome`（`./diy.sh` 与 `./sha.sh lab` 共用；不拦则 lab 开着生产数据根跑、还会把种子写进去；放行需 `DIY_ALLOW_PROD_HOME=1`）。细节见 `pkgs.ts/diy-app/AGENTS.md::env.home`
    id: agents.entry.home-guard
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: docs/instance-modes.md:40
      verifiedAt: '2026-10-21'
  entry#launch-vs-client:
    value: '**起 GUI 的入口是启动器，不是客户端**：`./sha.sh lab` 只 **spawn 新实例**，从不连已跑的那个（不读 `app.port`）—— 重复运行 = 开第二个实例 → 撞本数据根的 `SingletonLock` 并退出（`core/single-instance.ts::lockAdvice` 会打印「直接用它：`./diy.sh <命令>`」）。**要访问实例一律用客户端**，别指望再敲一次启动器'
    id: agents.entry.launch-vs-client
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: docs/instance-modes.md:35
      verifiedAt: '2026-10-21'
  entry#port:
    value: 端口**不承载身份**：探活后必须问 `getAppInfo.diyHome` 验身份，不是本数据根就另起（##328）。优先级 / 缺省 / 非生产不沿用记录里的 `18888` 见 `pkgs.ts/diy-app/AGENTS.md::env.port`
    id: agents.entry.port
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: docs/instance-modes.md:34
      verifiedAt: '2026-10-21'
  entry#prod:
    value: 全局 `diy` 一般由 main 上 `npm link` 而来 → 跑的是 **main 的 `build/prod` 编译产物**；worktree 里改的码它看不到
    id: agents.entry.prod
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: docs/instance-modes.md:36
      verifiedAt: '2026-10-21'
  entry#risk:
    value: worktree 改码跑测一律 `./diy.sh`（隔离数据根）；**查/改真实数据才用全局 `diy`**。继承来的生产 `DIY_HOME` 一律拒（放行 `DIY_ALLOW_PROD_HOME=1`）
    id: agents.entry.risk
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:28
      verifiedAt: '2026-10-21'
  entry#seed:
    value: 空数据根的初始种入：**生产根永不种入**；`lab` 缺省自动只跑一次（`.seed-done` 标记，删掉的 provider 不会被种回来）。开关三态 / 补缺命令 / 落点见 `pkgs.ts/diy-app/AGENTS.md::env.seed`
    id: agents.entry.seed
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: docs/instance-modes.md:44
      verifiedAt: '2026-10-21'
  entry#variant-match:
    value: '**客户端与服务端变体必须配对**，不配对 = 对着另一个数据根敲命令（症状：任务不存在 / 改完没反应）'
    id: agents.entry.variant-match
    review: accepted
    lifecycle: active
    evidence:
