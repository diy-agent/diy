# knowledge/facts/entry.yaml

# 生成物式的真源：整篇由 `diy facts submit` 写入（字段顺序、条目排序都由程序定）。
domain: entry
facts:
  - id: agents.entry.choose
    subject: entry
    aspect: choose
    value: '**先问「操作谁的数据」**：真实任务/项目/agent → 全局 `diy`；worktree 改码·跑测试 → `./diy.sh`；人看 UI 效果 / agent 实验 → `./sha.sh lab`。**别拿 `./diy.sh` 查生产任务**（它的 `./build/<variant>/home` 里没有 → 报「任务 N 不存在」）'
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:37
      verifiedAt: '2026-10-21'
  - id: agents.entry.client
    subject: entry
    aspect: client
    value: '`diy` 与 `./diy.sh` **都是客户端、都不启动 GUI**：读 `$DIY_HOME/app.port` 探活并**验身份**（连上去问 `getAppInfo.diyHome` 比对，不是本数据根就拒绝复用、另起自己的，##328(实例身份只靠端口)），探不到才 spawn Electron（CLI 与 GUI 是两进程）。连哪个实例由 `DIY_HOME`（数据根）决定'
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:40
      verifiedAt: '2026-10-21'
  - id: agents.entry.gui
    subject: entry
    aspect: gui
    value: 起 GUI 两条路：`./sha.sh lab`（HMR，免构建）或 `sha.sh build` 后由 CLI 拉起
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:42
      verifiedAt: '2026-10-21'
  - id: agents.entry.home-guard
    subject: entry
    aspect: home-guard
    value: 「继承来的生产 `DIY_HOME` 一律拒绝」：判据 `core/instance-identity.ts::isProdDataHome`、回落 `core/dev-home.ts::resolveDevHome`（`./diy.sh` 与 `./sha.sh lab` 共用；不拦则 lab 开着生产数据根跑、还会把种子写进去；放行需 `DIY_ALLOW_PROD_HOME=1`）。细节见 `pkgs.ts/diy-app/AGENTS.md::env.home`
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:47
      verifiedAt: '2026-10-21'
  - id: agents.entry.launch-vs-client
    subject: entry
    aspect: launch-vs-client
    value: '**起 GUI 的入口是启动器，不是客户端**：`./sha.sh lab` 只 **spawn 新实例**，从不连已跑的那个（不读 `app.port`）—— 重复运行 = 开第二个实例 → 撞本数据根的 `SingletonLock` 并退出（`core/single-instance.ts::lockAdvice` 会打印「直接用它：`./diy.sh <命令>`」）。**要访问实例一律用客户端**，别指望再敲一次启动器'
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:43
      verifiedAt: '2026-10-21'
  - id: agents.entry.port
    subject: entry
    aspect: port
    value: 端口**不承载身份**：探活后必须问 `getAppInfo.diyHome` 验身份，不是本数据根就另起（##328）。优先级 / 缺省 / 非生产不沿用记录里的 `18888` 见 `pkgs.ts/diy-app/AGENTS.md::env.port`
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:41
      verifiedAt: '2026-10-21'
  - id: agents.entry.prod
    subject: entry
    aspect: prod
    value: 全局 `diy` 一般由 main 上 `npm link` 而来 → 跑的是 **main 的 `build/prod` 编译产物**；worktree 里改的码它看不到
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:39
      verifiedAt: '2026-10-21'
  - id: agents.entry.risk
    subject: entry
    aspect: risk
    value: worktree 改码跑测一律 `./diy.sh`（隔离 `./build/<variant>/home`；会拒绝继承来的生产 `DIY_HOME`，需 `DIY_ALLOW_PROD_HOME=1` 放行）；**查/改真实数据才用全局 `diy`**
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:46
      verifiedAt: '2026-10-21'
  - id: agents.entry.seed
    subject: entry
    aspect: seed
    value: 空数据根的初始种入：**生产根永不种入**；`lab` 缺省自动只跑一次（`.seed-done` 标记，删掉的 provider 不会被种回来）。开关三态 / 补缺命令 / 落点见 `pkgs.ts/diy-app/AGENTS.md::env.seed`
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:48
      verifiedAt: '2026-10-21'
  - id: agents.entry.variant-match
    subject: entry
    aspect: variant-match
    value: '**客户端与服务端变体必须配对**：`./sha.sh lab` 起的配 `DIY_VARIANT=lab ./diy.sh`（与 `./diy.sh` 缺省同变体，故平常不必显式给）。不配对 = 对着**另一个数据根**敲命令（症状：任务不存在 / 改完没反应）。`./diy.sh` 能连上 HMR 实例，是因为 `electron-dev.mts` 的 watch 已把 `build/<v>/main` 产出来了'
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:44
      verifiedAt: '2026-10-21'
  - id: agents.entry.variant
    subject: entry
    aspect: variant
    value: '**`DIY_VARIANT` 是产物/数据分根的唯一轴**（vite `outDir`、运行时 `build/<v>/main` 都由它定），缺省 `prod`（`./diy.sh` 缺省 `lab`）。`preview` 变体**已删除**（##381）：任何入口遇 `DIY_VARIANT=preview` 一律**显式报错**，不静默落 `build/preview/**`；报错落点清单见 `pkgs.ts/diy-app/AGENTS.md::env.variant`'
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:38
      verifiedAt: '2026-10-21'
