    value: |-
      TS + Effect 的完整 agent；**工具契约最全**：`packages/core/src/tool/plugin/*.ts`（edit / write / read / patch / glob / grep / shell），带权限审批、formatter 钩子、返回文件 diff。
    id: agents.ref.opencode
    review: accepted
