      verifiedAt: '2026-10-22'
  plan.event-protocol#no-action-op:
    value: '**`action` / `op` / `start|stop|delta|patch` 都不再作为事件字段**：`action` 表示命令或意图（`tool.call`），持久化日志记**已发生的事实**（`tool.requested` / `context.replaced`）；`start/stop` 只是流生命周期 ⇒ `frame.mode(unary|stream)` + `frame.phase(single|begin|data|end|abort)`。旧 `delta` 由 `phase=data` 表达（不再需要 `delta_content`）。'
    id: plan.event-protocol.no-action-op
    review: accepted
