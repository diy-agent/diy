  plan.event-protocol#parent-vs-cause:
    value: '**`entity.parent` 与 `cause` 不可混用**：parent = 实体树的结构关系（只在实体首次出现时给，后续靠 id 引用）；cause = 事件之间的因果关系。于是系统同时有「实体关系树 / 事件关系有向图 / 日志线性追加序列」三层 —— 这正是多工具并发、事件交错、独立回放的基础。'
    id: plan.event-protocol.parent-vs-cause
