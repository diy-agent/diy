  plan.context-placement#requirements:
    value: 实现验收（下一轮，需求级）：**R1** 易变内容（`task.body`/`cwd.note`/`chain[].content`）变化时 leading system **逐字节不变**；**R2** 变化事实渲染成尾部 user 消息、正文自带 supersede 语义；**R3** 内容未变不发（避免 token 堆积）；**R4** 全部消失要发**显式清空**文案（否则旧快照继续生效）；**R5** system 在前、snapshot 在该步 user 输入之前；**R6** 预算口径仍判「实际发送的完整 system 部分」，快照是否计入实现时定并写进测试；**R7** 渲染失败 / 变量缺失沿用严格硬错，不得降级为空快照。
    id: plan.context-placement.requirements
    review: accepted
    lifecycle: active
