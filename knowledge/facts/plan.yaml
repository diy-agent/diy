  plan.event-protocol#type-data:
    value: '统一判别结构 = **`{type, data}`**：「判别键同级 = 公共字段，分支私有进 `data`」。**不用** `{type, [type]: …}`（类型名成动态字段、会与公共字段碰撞），也**不设通用 `body` 杂货袋**；`status` 这类公共元数据留在 `fact` 同级。**不要求 TypeScript 泛型**（普通判别联合 + 接口继承即可），但运行时仍需 Zod（TS 类型会被擦除）。'
    id: plan.event-protocol.type-data
