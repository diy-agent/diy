  plan.context-placement#constraints:
    value: 四条语义约束（决定落点，不只为缓存）：① in-history system 必须是**完整 prompt**，不能是 delta（模型把最新 system 当完整提示，delta 会静默丢掉未变段）；② system 必须排在**该步 user 输入之前**；③ 清空要清**所有活跃 system 节点**（只清最新会让旧 prompt 复活）；④ node 0 受保护、不可被压缩/遮蔽，后续 system 节点可。代理层改写/重排 system 会静默破坏语义 —— 真实 API 的 cache-hit e2e 是唯一探测器。
    id: plan.context-placement.constraints
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: b0ff9948:docs/plans/2026-09-21-prompt-cache-and-dynamic-context.md:96
      verifiedAt: '2026-10-22'
  plan.context-placement#diy-gap:
    value: '`diy` 现状（`_system.md`：identity → diy → project → task → rules → skills → guard，全部一条 leading system，每轮全量重算）：`identity`/`diy`/`rules`/`_guard` 不变 ✅ 留 system；`project.md` 的 `<project_context>`（随 AGENTS.md 变）偶尔变 ⇒ 应挪；`task.md`（`task.body` 用户随时改、`cwd.*` 随回退变）**每轮可能变** ⇒ 必须挪到尾部 user 快照；`skills.md` 会话内基本不变 ⇒ system 可接受。病根 = **把易变内容放在最贵的位置**。'
