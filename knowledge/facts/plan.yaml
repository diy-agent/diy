  plan.event-protocol#source-origin-cause:
    value: 三分必须分清：**`source` = 哪个 diy 模块实际写出这条记录**（`diy.ui` / `diy.agent.transport` / `diy.tool-runner` / `diy.prompt`，由宿主代码确定，**不能由 LLM 或工具参数填写**）；**`origin` = 事实内容来自谁**（`llm{provider,model}` / `user{channel}` / `process{name,pid}` / `application{module}`，同样 `type+data`）；**`cause` = 为什么发生**（`{eventId, relation}`，如 `response-to`）。
    id: plan.event-protocol.source-origin-cause
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: b0ff9948:docs/plans/2026-09-22-agent-event-protocol.md:259
      verifiedAt: '2026-10-22'
  plan.event-protocol#three-authorities:
    value: '**三种权威数据必须分开**（可以同文件但用途不同）：`ops` 事件事实日志 = UI / 审计 / 回放 / 状态投影的权威；`llm` 消息历史 = 续聊构造下一次请求的权威；`raw` 请求观测 = 旁路 HTTP/stream 快照（仅调试，可选）。UI **不应**直接把 LLM 消息日志当事件日志，LLM 也**不应**依赖 UI 展示模型。'
    id: plan.event-protocol.three-authorities
    review: accepted
