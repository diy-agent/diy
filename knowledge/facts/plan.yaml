  plan.event-protocol#context-tree:
    value: '事件日志 ≠ model wire：**Context Tree 是唯一上下文状态**（不维护事实树与投影树两套），三层 = `places`（割点集合，唯一 placement 配置）/ system 容器（每请求全量重建）/ runtime 容器（路径级 patch + 定期 snapshot）。规则：places 两两不可互为祖先后代；system 不进消息历史故不需补丁；compaction / 恢复 / patch 超阈值 / placement 迁移 / wire 版本升级 / 用户手动 ⇒ 发全量 snapshot 且 `supersedes: all`；变化按 step 最终 hash 比较（中途改后恢复原值 = 未变）；`WIRE_VERSION = sha256(canonical(WIRE_ENCODING)).slice(0,8)`。'
    id: plan.event-protocol.context-tree
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: b0ff9948:docs/plans/2026-09-22-agent-event-protocol.md:531
      verifiedAt: '2026-10-22'
  plan.event-protocol#entity-types:
    value: 实体/事实类型固定几类：`message.submitted`（用户消息是 `unary+single`，不拆 start/delta/stop；发送失败也**不删**这条事实）；`text`/`think` = `stream` + `content|completed|failed`；工具统一 `entity.type=tool` + `fact.data.name`（**不为 bash/read 各建 `tool.bash` 实体类型**）；`context` = `replaced|patched|snapshot|removed`；`decision` = `made`。
    id: plan.event-protocol.entity-types
    review: accepted
    lifecycle: active
    evidence:
      source: code
      at: b0ff9948:docs/plans/2026-09-22-agent-event-protocol.md:451
      verifiedAt: '2026-10-22'
  plan.event-protocol#id-rule:
    value: '**实体 id 与事件 id 分离**：实体 id 是 session 局部可读层级路径（`session/1/turn/1/step/1/tool/1`），表示持续存在的实体；eventId 是 `session/1/event/42`，表示一条具体记录。工具服务商的 `callId` 留在 `fact.data`，**不当实体 id**（同一实体可有多条事件；按实体回放、按事件追踪）。'
    id: plan.event-protocol.id-rule
