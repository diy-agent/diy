      verifiedAt: '2026-10-22'
  plan.event-protocol#legacy-map:
    value: 旧协议 → 新协议：`start`→`phase=begin`+声明实体；`delta`→`phase=data`+对应 `fact.type`；`patch`→`phase=data`+具体事实类型；`stop`→`phase=end`；user 三段消息→`unary+single` 的 `message.submitted`；`meta`→结构字段；`fields`→`fact.data`；`kind`→`entity.type`；`parent`→`entity.parent`。**未发布阶段直接切换，不做迁移兼容**。
    id: plan.event-protocol.legacy-map
    review: accepted
    lifecycle: active
    evidence:
