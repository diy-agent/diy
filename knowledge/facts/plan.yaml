  plan.context-placement#prefix-cache:
    value: 理论依据：**provider prefix cache 按前缀字节完整匹配**（DeepSeek 尤其），首条 wire 消息一变，system+history 的长前缀全部失效 —— 长 agentic 会话反复付这笔。Anthropic 指引同向：变化的 per-request context 应放在稳定缓存前缀**之后**。跨 harness：Codex 把权限建模成 developer 角色 `WorldState` + fingerprint（只在变时发）；Hermes 会话内 system 固定、变化通知 prepend 到下一条 user。
    id: plan.context-placement.prefix-cache
    review: accepted
