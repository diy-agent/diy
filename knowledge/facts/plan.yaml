  plan.context-placement#three-channels:
    value: 三通道判据（不是两个）：① **leading system（node 0）** = 整会话几乎不变（身份 / persona / 工具指引）；② **in-history system append** = 偶尔变、且模型声明支持 `systemPromptUpdate:'in-history'`；③ **尾部 user 消息** = 每步都可能变或需逐次重算（snapshot / notice / instructions / relay / recall 五 form）。dsh 原话：prompt 在**大多数步**都变的，就该挪进 **runtime context**。
    id: plan.context-placement.three-channels
    review: accepted
    lifecycle: active
    evidence:
