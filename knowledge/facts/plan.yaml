  plan.context-placement#user-channel-cost:
    value: user 通道的固有代价：`source:{kind,plugin,form}` **不发给模型**（只用于日志/UI），模型只能靠正文 frame 文案识别「这不是用户说的」（opencode 用 `<system-reminder>` + 提示词声明；dsh 用 `Current runtime context … supersedes earlier …`）。in-history 的成本：追加节点**每次请求都付自己的 token** 直到被压缩遮蔽 ⇒ 变化少 → append 划算；几乎每步都变 → 下沉 user。
