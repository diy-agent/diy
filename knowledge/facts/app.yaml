  app.dev#watch-restart:
    value: |-
      改 `src/**` 会触发 lab watch 重启 Electron，**正在跑的本机 agent 轮次会被打断**（tool 被标 `interrupted`；这是「本轮未完成/流中断」的头号成因，实测 12/12 —— facts `dev.turn-interrupt#rate`）。三条对策：① 轮次中别拿源码当探针，探针写 `/tmp`；② **要持续对话的实例改用 preview**（`pkgs.ts/diy-app/sha.sh preview` = 编译后运行、无 watch，改 src 波及不到它；lab 留给边改边看，见 `app.entry#variant`）；③ `interrupted.data` 今天为空，热重启与真流断仍无法区分（`dev.turn-interrupt#blind`）。
    id: app.dev.watch-restart
    review: accepted
    lifecycle: active
    evidence:
