      verifiedAt: '2026-10-21'
  tool#publish:
    value: npm 发布（`@diy-agent`）：根 `./sha.sh publish [--dry-run]`，认证 `NPM_PUBLISH_TOKEN`；仓内 `package.json` 恒指 `src/*.ts` 且留 `private:true`（护栏）
    id: agents.tool.publish
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:39
      verifiedAt: '2026-10-21'
  tool#skill-dir:
    value: 共享 skills 真身在 `~/.agents/skills/`（`~/.hermes/skills/skills` 是它的 symlink，归档区 `~/.agents/skills.archive/` 同仓）；**自 2026-10-22 起是独立 git 仓**（首提交 `b961916`，279 文件 / 2.2 MB）—— 此前因磁盘满被手动删过 `.git`，单机仓只防误改、不防盘挂
    id: agents.tool.skill-dir
    review: accepted
    lifecycle: active
