# knowledge/facts/tool.yaml

# 生成物式的真源：整篇由 `diy facts submit` 写入（字段顺序、条目排序都由程序定）。
domain: tool
facts:
  - id: agents.tool.check
    subject: tool
    aspect: check
    value: '`./sha.sh check` 是**提交前唯一检查**（tsc `--noEmit` + oxlint + 产物 / 可执行位 / 规范索引护栏）；改一行只跑受影响测试，全量收工前一次'
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:34
      verifiedAt: '2026-10-21'
  - id: agents.tool.cli
    subject: tool
    aspect: cli
    value: 查/改数据：生产 `diy <域> <命令>` · worktree `./diy.sh <域> <命令>`；**域名清单真源 = `diy --help`**，别抄清单
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:37
      verifiedAt: '2026-10-21'
  - id: agents.tool.confirm
    subject: tool
    aspect: confirm
    value: 破坏性操作的应用内二次确认走 `ConfirmDialog.tsx`；**禁用原生 `window.confirm`**（窗口级模态，且自动化点不到）
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:44
      verifiedAt: '2026-10-21'
  - id: agents.tool.electron-cache
    subject: tool
    aspect: electron-cache
    value: '**缓存里明明有 zip 却重下**的根因：`@electron/get` 缓存键 = **下载 URL 目录**的 sha256；`~/.npmrc` 的 `electron_mirror` 只在 npm 上下文生效（运行时直接 node 没有 `npm_config_electron_mirror`）⇒ 走 GitHub 键必 miss。`ensure-electron` 显式读 npmrc 把镜像传下去，键才与 npm 安装时一致'
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: docs/toolchain.md:51
      verifiedAt: '2026-10-21'
  - id: agents.tool.electron
    subject: tool
    aspect: electron
    value: electron 43 **无 postinstall**：缺二进制会在进程内**无超时**下载（症状＝静默卡死）；布局与校验收口 `scripts/ensure-electron.mjs` + `ensure-electron-if-needed.sh`
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:42
      verifiedAt: '2026-10-21'
  - id: agents.tool.fmt
    subject: tool
    aspect: fmt
    value: 格式真源 = 各包 `.oxfmtrc.json`（oxfmt **不读** `package.json` 的 `oxfmt` 块）；**fmt 未纳入 `check`**（##323(oxfmt 配置腐坏)）
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:35
      verifiedAt: '2026-10-21'
  - id: agents.tool.model-import
    subject: tool
    aspect: model-import
