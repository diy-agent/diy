  - id: agents.tool.publish
    subject: tool
    aspect: publish
    value: '**npm 发布（`@diy-agent` scope）**：根 `./sha.sh publish [--dry-run]` → 清单 `_npm_publish_pkgs`（diy-rpc / diy-ui）各自 `./sha.sh publish`（= `tsc -p tsconfig.build.json` + `scripts/npm-publish.mjs` 在 `dist/` 生成发行版 package.json，再 `npm publish dist`）。仓内 package.json 恒指 `src/*.ts` 且留 `private:true`（护栏）；认证 `NPM_PUBLISH_TOKEN`（环境变量或 `~/.bashrc`），CI 无则跳过而非报错'
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:59
      verifiedAt: '2026-10-21'
  - id: agents.tool.sync-gate
    subject: tool
    aspect: sync-gate
    value: '**build/check/test/lab 入口先过 `ensure-sync`**：只读快检 `scripts/check-sync.mjs`（workspace 链接缺失/过期 + sync 印记 `node_modules/.diy-sync.stamp` 落后 + submodule 未 init；electron `dist`/`path.txt` 只提示不判定 —— 由 `sync-deps` 的 `ensure-electron` 补；`npm i` 只补缺失、清不了改名残留，故 `sync-deps` 里另跑 `--fix` 精准清）命中即自动跑 `sync-deps`（= `sync` 去掉 dev 数据根投影）；`DIY_AUTO_SYNC=0` 关掉改报错，`./sha.sh sync-status` 只看状态'
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:61
      verifiedAt: '2026-10-21'
  - id: agents.tool.sync
    subject: tool
    aspect: sync
    value: '**新开 worktree 先 `./sha.sh sync`**（`npm i --workspaces --include-workspace-root` + 子模块 + 各包 sync + electron 二进制收成共享软链）；不跑则包没装、`node_modules` 缺。`--include-workspace-root` 不能省：光 `npm i --workspaces` 只装 workspace、漏装根 package.json 依赖（`remark-gfm` 等），干净 worktree 上必现 build 解析失败。**末尾顺带把 `~/.diy` 的真配置（`model.yaml` / `context.yaml` / `personas.yaml` / `providers.custom.yaml`）投影进 `build/<variant>/home/`**（`sync-dev-home` 一步；变体随 `DIY_VARIANT`，缺省 lab，`DIY_SYNC_HOME=0` 关）—— seed 只种示例数据，真配置归它'
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:60
      verifiedAt: '2026-10-21'
