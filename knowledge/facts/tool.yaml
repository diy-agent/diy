  - id: agents.tool.electron-cache
    subject: tool
    aspect: electron-cache
    value: '**缓存里明明有 zip 却重下**的根因：`@electron/get` 缓存键 = **下载 URL 目录**的 sha256；`~/.npmrc` 的 `electron_mirror` 只在 npm 上下文生效（运行时直接 node 没有 `npm_config_electron_mirror`）⇒ 走 GitHub 键必 miss。`ensure-electron` 显式读 npmrc 把镜像传下去，键才与 npm 安装时一致'
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:63
      verifiedAt: '2026-10-21'
  - id: agents.tool.electron
    subject: tool
    aspect: electron
    value: 'electron 43 **无 postinstall**：`require(''electron'')` 时二进制缺就在**当时进程里**下载、**无超时**（症状＝静默卡死数分钟、CPU 0%，日志看着像「在跑」）；`dist` 是**悬空软链**（store 被缓存清理工具删）时更糟 —— 自带 `install.js` 直接失败 `failed to create destination …: File exists` 并误导「删掉 node_modules/electron」，**不会自己重下**。布局收口在 `scripts/ensure-electron.mjs`（全机一份 store + worktree 的 `dist` 只留软链 + 补 `path.txt`）：`sync-deps` 末尾自动跑且**不联网**；`pkgs.ts/diy-app/sha.sh` 的 `lab|test-intent|start` 起 Electron 前硬校验；**CLI 两条入口**（`diy.sh` / `bin/diy`）先过 `scripts/ensure-electron-if-needed.sh`（纯 bash 快检，就绪零 node 开销）—— CLI 顶层 `import electronPath from "electron"`，**每条命令**都经它。开关 / store 位置 / 坑见脚本头注'
    review: accepted
    lifecycle: active
    evidence:
      source: user
      at: AGENTS.md:62
      verifiedAt: '2026-10-21'
  - id: agents.tool.fmt
    subject: tool
    aspect: fmt
    value: '格式化配置真源 = **各包 `.oxfmtrc.json`**（根 `.oxfmtrc.json` 兜底）：oxfmt **不读** `package.json` 里的 `oxfmt` 块，真实键名是 `tabWidth`/`printWidth`/`singleQuote`；根 `fix()` 扫 `pkgs.ts/` **全量（含 .md/.json）**；**fmt 未纳入 `check`**（存量 ~400 文件待规范化，见 ##323(oxfmt 配置腐坏)）'
    review: accepted
