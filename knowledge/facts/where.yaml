# knowledge/facts/where.yaml

# 生成物式的真源：整篇由 `diy facts submit` 写入（字段顺序、条目排序都由程序定）。
domain: where
facts:
  where#agent:
    value: |-
      「谁在跑 / 跟别的 agent 说话 / 中止别人」→ `diy agent local running`（活体表）· `chat <taskUri> --message -` · `history <taskUri>` · `cancel <taskUri>`
    id: where.agent
    review: accepted
    lifecycle: active
    evidence:
      source: user
  where#cmd:
    value: |-
      「这命令怎么用 / 有什么能力」→ `diy --help` 与 `diy <域> --help`（真源，别猜）；提示词骨架 `diy template`。
    id: kb.where.cmd
    review: accepted
    lifecycle: active
    evidence:
      source: user
      verifiedAt: '2026-10-23'
  where#code:
    value: |-
      「这功能在哪 / 怎么实现」→ `diy facts brief find`（各包定位）+ `rg`/`fd`（排 `.venv` `node_modules` `dist`）；扫前先 `du -d 1 -h` 看体量。
    id: kb.where.code
    review: accepted
    lifecycle: active
    evidence:
      source: user
      verifiedAt: '2026-10-23'
  where#config:
    value: |-
      「X 怎么配」三处：模型/价格 `diy llmConfig read`（`$DIY_HOME/model.yaml` + `providers.custom.yaml`）· 人物 `personas.yaml` · 上下文组装 `context.yaml`。代码内缺省值走 `where#code`。
    id: kb.where.config
    review: accepted
    lifecycle: active
    evidence:
      source: user
      verifiedAt: '2026-10-23'
  where#doc:
    value: |-
      「设计稿 / 方案 / 计划」→ `diy docs index`（`docs/` 不在 AGENTS.md 链上）。信封的 `docs` 单元只给摘要，且**按项目路径求仓库根** —— 项目不在仓库内则整节缺席（lab 的 sample-project 就是这样，别以为 docs 单元坏了）；任务自己的产出在 `$DIY_HOME/<taskUri>/gen/`。
    id: kb.where.doc
    review: accepted
    lifecycle: active
    evidence:
      source: user
      verifiedAt: '2026-10-25'
  where#fact:
    value: |-
      「X 现在是什么 / 有没有约定」→ `diy facts find <词>`（多词=与）→ `brief <主题>` → `get <主题>#<面>`；已知主题见 `runtime.kb`。**先查库，再 rg**。
    id: kb.where.fact
    review: accepted
    lifecycle: active
    evidence:
      source: user
      verifiedAt: '2026-10-23'
  where#history:
    value: |-
      「当时为什么这么定 / 做过什么」→ `diy journal find <taskUri>`（append-only 事件流）。
    id: kb.where.history
    review: accepted
    lifecycle: active
    evidence:
      source: user
      verifiedAt: '2026-10-23'
  where#job:
    value: |-
      「那条后台长活跑完了吗 / 停了没」→ `diy job ps` · `tail <runId>` · `job kill <runId>`（只管 background；前台命令不登记）
    id: where.job
    review: accepted
    lifecycle: active
    evidence:
      source: user
  where#locate-first:
    value: |-
      问题里的名词不认识 / 「X 在哪」→ 先看本库 full 暴露的 `where#*`（信息地图）**定类**，再用 `diy facts find <词>` 确认它指什么；不许先 rg 猜词乱翻。
    review: accepted
    lifecycle: active
    evidence:
      source: user
      verifiedAt: '2026-10-23'
  where#rule:
    value: |-
      只写「去哪查」，不写值；一行一条通道（通道才变，故不腐坏）。判据：再过一轮，这行还成立吗？
    id: kb.where.rule
    review: accepted
    lifecycle: active
    evidence:
      source: user
      verifiedAt: '2026-10-23'
  where#runtime:
    value: |-
      运行时值（端口 / 数据根 / 环境）：本信封 `system.*` · `runtime.*` · `runtimeDiff.*`；值不进库，别去 rg。
    id: kb.where.runtime
    review: accepted
    lifecycle: active
    evidence:
      source: user
      verifiedAt: '2026-10-23'
  where#task:
    value: |-
      「谁在做什么 / 任务树 / 某任务目标」→ `diy task list` · `diy task show <uri>`；body 只留结论，过程走 `where#history`。
    id: kb.where.task
    review: accepted
    lifecycle: active
    evidence:
      source: user
      verifiedAt: '2026-10-23'
  where#traffic:
    value: |-
      真发出去的请求（含消息体）：`runtime.reqlog.file`（按天 jsonl）；UI 流量页 / 「该步实际请求」。
    id: kb.where.traffic
    review: accepted
    lifecycle: active
    evidence:
      source: user
      verifiedAt: '2026-10-23'
