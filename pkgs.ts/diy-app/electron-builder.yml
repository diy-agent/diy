# electron-builder.yml
# 🎯 diy 管控台 打包配置

appId: com.diy.app
productName: diy
copyright: Copyright © 2026
electronVersion: "43.1.1"

# buildResources 挪 res/：build/ 现在是产物根（build/prod/**），不能再当资源目录
# （否则 electron-builder 会把整个 build/ 当资源并从打包里排除）。
directories:
  output: release
  buildResources: res

files:
  - build/prod/**/*
  - package.json
  - "!node_modules/**"

asar: true

# ── macOS ──
mac:
  icon: res/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  artifactName: "${productName}-${version}-${arch}.${ext}"

dmg:
  title: "diy 管控台"

# ── Linux ──
linux:
  target:
    - AppImage
    - deb
  category: Development
  artifactName: "${productName}-${version}-${arch}.${ext}"

# ── Windows ──
win:
  target:
    - portable
  artifactName: "${productName}-${version}-${arch}.${ext}"
