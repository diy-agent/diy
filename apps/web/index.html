<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>diy web</title>
        <style>
            :root {
                color-scheme: light;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                background: #f6f7f9;
                color: #1f2328;
                font:
                    14px/1.6 -apple-system,
                    'PingFang SC',
                    'Microsoft YaHei',
                    sans-serif;
            }
            #app {
                height: 100%;
            }
            /* ── 登录 / 等待页（未授权时的全部界面）── */
            .login {
                max-width: 460px;
                margin: 0 auto;
                padding: 64px 24px;
                display: flex;
                flex-direction: column;
                gap: 14px;
            }
            .login h1 {
                font-size: 18px;
                margin: 0;
            }
            .login .peer {
                padding: 10px 12px;
                border: 1px solid #e4e7eb;
                border-radius: 8px;
                background: #fff;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 12.5px;
                color: #3a3f46;
                word-break: break-all;
            }
            .login label {
                display: flex;
                flex-direction: column;
                gap: 6px;
                font-size: 13px;
                color: #57606a;
            }
            .login input {
                padding: 9px 11px;
                border: 1px solid #d0d7de;
                border-radius: 8px;
                font: inherit;
                background: #fff;
            }
            .login button {
                align-self: flex-start;
                padding: 9px 18px;
                border: 0;
                border-radius: 8px;
                background: #1f6feb;
                color: #fff;
                font: inherit;
                cursor: pointer;
            }
            .login button[disabled] {
                background: #9db8e8;
                cursor: progress;
            }
            .login .status {
                min-height: 22px;
                font-size: 13px;
                color: #57606a;
            }
            .login .status[data-tone='warn'] {
                color: #9a6700;
            }
            .login .status[data-tone='bad'] {
                color: #b42318;
            }
            .login .note {
                font-size: 12.5px;
                color: #8b949e;
            }
            .spinner {
                display: inline-block;
                width: 10px;
                height: 10px;
                margin-right: 6px;
                border: 2px solid #1f6feb;
                border-top-color: transparent;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                vertical-align: -1px;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="./index.js"></script>
    </body>
</html>
