<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>dev 启动器</title>
        <style>
            :root {
                --fg: #1a1a1a;
                --dim: #8b95a1;
                --line: #e4e7eb;
                --accent: #3b6fd4;
                --ok: #22a35c;
                --warn: #d97706;
                --err: #c0392b;
                --bg: #f7f8fa;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font:
                    13px/1.55 -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                color: var(--fg);
                background: var(--bg);
                height: 100vh;
                display: flex;
                overflow: hidden;
            }

            /* 左侧树 */
            #side {
                width: 360px;
                min-width: 260px;
                max-width: 520px;
                background: #fff;
                border-right: 1px solid var(--line);
                display: flex;
                flex-direction: column;
                flex-shrink: 0;
            }
            #side .top {
                padding: 11px 14px;
                border-bottom: 1px solid var(--line);
                font-weight: 600;
                font-size: 13.5px;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            #side .top small {
                font-weight: 400;
                color: var(--dim);
                font-size: 11px;
                margin-left: auto;
            }
            #tree {
                flex: 1;
                overflow: auto;
                padding: 4px 0;
            }
            .app {
                padding: 10px 14px 3px;
                font-size: 10.5px;
                color: var(--dim);
                letter-spacing: 0.4px;
                margin-top: 6px;
                border-top: 1px solid #eef0f3;
                display: flex;
                align-items: center;
                gap: 6px;
                font-family: ui-monospace, Menlo, monospace;
            }
            .app .badge {
                margin-left: auto;
                font-size: 9.5px;
                padding: 1px 6px;
            }
            .appsub {
                padding: 6px 14px 2px;
                font-size: 11px;
                color: #5b6470;
                font-weight: 600;
            }
            .leaf {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 2px 12px 2px 34px;
                font-size: 11px;
                color: #4a5563;
            }
            .leaficon {
                font-size: 10px;
                color: var(--dim);
            }
            .leaf .link,
            .kv .link {
                color: var(--accent);
                text-decoration: none;
                font-family: ui-monospace, Menlo, monospace;
                font-size: 11px;
                word-break: break-all;
            }
            .leaf .link:hover,
            .kv .link:hover {
                text-decoration: underline;
            }
            .muted {
                color: var(--dim);
                font-size: 10.5px;
            }
            .entry.dim .nm {
                opacity: 0.5;
            }
            .entry {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 6px 10px 6px 16px;
                cursor: pointer;
                position: relative;
            }
            .entry:hover {
                background: #f4f7fc;
            }
            .entry.sel {
                background: #eaf1fd;
            }
            .entry.sel::before {
                content: "";
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                width: 2px;
                background: var(--accent);
            }
            .entry .nm {
                flex: 1;
                min-width: 0;
                font-size: 12.5px;
            }
            .entry .nm span {
                display: block;
                font-size: 10px;
                color: var(--dim);
                font-family: ui-monospace, Menlo, monospace;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .entry .acts {
                display: flex;
                gap: 3px;
                opacity: 0;
                transition: opacity 0.12s;
            }
            .entry:hover .acts,
            .entry.sel .acts {
                opacity: 1;
            }
            .entry .acts button {
                padding: 2px 6px;
                font-size: 10.5px;
                border-radius: 5px;
                border: 1px solid var(--line);
                background: #fff;
                cursor: pointer;
                line-height: 1.5;
                font-family: inherit;
            }
            .entry .acts button:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            .entry .acts button.stop {
                color: var(--err);
            }
            .dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                flex-shrink: 0;
            }
            .dot.on {
                background: var(--ok);
                box-shadow: 0 0 0 3px rgba(34, 163, 92, 0.15);
            }
            .dot.off {
                background: #d5d9e0;
            }
            .dot.wait {
                background: var(--warn);
            }

            /* 拖拉条（createSplitPane 创建，样式由这里给） */
            #split {
                background: transparent;
            }
            #split:hover {
                background: #dbe4f3;
            }

            #main {
                flex: 1;
                display: flex;
                flex-direction: column;
                min-width: 0;
            }
            #head {
                padding: 12px 20px;
                border-bottom: 1px solid var(--line);
                background: #fff;
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
            }
            #head h1 {
                font-size: 14.5px;
                font-weight: 600;
            }
            #head .m {
                font-size: 11px;
                color: var(--dim);
                font-family: ui-monospace, Menlo, monospace;
            }
            #body {
                flex: 1;
                overflow: auto;
                padding: 18px 20px;
            }
            .card {
                background: #fff;
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 14px 16px;
                margin-bottom: 12px;
            }
            .card h2 {
                font-size: 11px;
                font-weight: 600;
                color: var(--dim);
                text-transform: uppercase;
                letter-spacing: 0.6px;
                margin-bottom: 10px;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .card h2 .r {
                margin-left: auto;
                font-weight: 400;
                text-transform: none;
                letter-spacing: 0;
            }
            .kv {
                display: grid;
                grid-template-columns: 100px 1fr;
                gap: 6px 12px;
                font-size: 12.5px;
            }
            .kv dt {
                color: var(--dim);
            }
            .kv dd {
                font-family: ui-monospace, Menlo, monospace;
                font-size: 11.5px;
                word-break: break-all;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .kv dd .open {
                display: flex;
                gap: 3px;
                margin-left: auto;
                flex-shrink: 0;
            }
            .kv dd .open button {
                padding: 1px 6px;
                font-size: 10px;
                border-radius: 4px;
                border: 1px solid var(--line);
                background: #fff;
                cursor: pointer;
                font-family: inherit;
                color: #555;
            }
            .kv dd .open button:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            .acts {
                display: flex;
                gap: 7px;
                flex-wrap: wrap;
                margin-top: 13px;
            }
            button {
                padding: 6px 12px;
                border-radius: 7px;
                font: inherit;
                font-size: 12px;
                cursor: pointer;
                border: 1px solid #cbd5e1;
                background: #fff;
            }
            button:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            button.pri {
                background: var(--accent);
                color: #fff;
                border-color: var(--accent);
            }
            button.pri:hover {
                color: #fff;
                opacity: 0.92;
            }
            button.danger {
                color: var(--err);
                border-color: #e8c4c0;
            }
            button.small {
                padding: 5px 10px;
                font-size: 11.5px;
            }
            button:disabled {
                opacity: 0.45;
                cursor: default;
            }
            .badge {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                padding: 2px 8px;
                border-radius: 10px;
                font-size: 10.5px;
            }
            .badge.run {
                background: #e8f6ee;
                color: #1c7a43;
            }
            .badge.stop {
                background: #f0f1f3;
                color: #7a828d;
            }
            .badge.wait {
                background: #fdf3e3;
                color: #a15c05;
            }
            .uri {
                display: flex;
                align-items: center;
                gap: 8px;
                background: #f7f9fc;
                border: 1px solid #e0e6ef;
                border-radius: 7px;
                padding: 7px 10px;
                font-family: ui-monospace, Menlo, monospace;
                font-size: 11px;
                color: #2d6fd4;
            }
            .uri button {
                margin-left: auto;
                padding: 2px 8px;
                font-size: 10px;
                border-radius: 5px;
                flex-shrink: 0;
            }
            .cmdgrid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
                gap: 6px;
            }
            .cmdgrid button {
                padding: 7px 0;
                font-family: ui-monospace, Menlo, monospace;
                font-size: 11.5px;
            }
            .log {
                background: #1c1f24;
                color: #c8ccd4;
                font-family: ui-monospace, Menlo, monospace;
                font-size: 11px;
                padding: 11px;
                border-radius: 7px;
                max-height: 220px;
                overflow: auto;
                line-height: 1.65;
                white-space: pre-wrap;
            }
            .hint {
                font-size: 11.5px;
                color: var(--dim);
                margin-bottom: 10px;
            }
            .empty {
                padding: 60px 20px;
                text-align: center;
                color: var(--dim);
                font-size: 12.5px;
            }
        </style>
    </head>
    <body>
        <div id="side">
            <div class="top">dev 启动器 <small id="running"></small></div>
            <div id="tree"></div>
        </div>
        <div id="main">
            <div id="head">
                <h1 id="head-title">dev 启动器</h1>
                <span class="badge stop" id="head-badge">—</span>
                <span class="m" id="head-meta"></span>
                <span class="m" id="toast"></span>
                <span class="m" id="repo" style="margin-left: auto"></span>
            </div>
            <div id="body"><div class="empty">正在读取实例……</div></div>
        </div>
        <script src="./index.js"></script>
    </body>
</html>
