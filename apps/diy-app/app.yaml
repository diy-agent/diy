# apps/diy-app 的启动清单（dev 启动器 glob apps/*/app.yaml 得到「有什么能启动」）
#
# 「没有 variant 概念」—— 启动器只管「跑哪条命令、跑出来的东西长什么样」，
# variant 由命令自己决定（这里 ./sha.sh lab 起 lab 变体；prod 换成 ./sha.sh prod）。

name: diy-app
title: diy 管控台

launches:
  - id: lab
    title: 开发（lab）
    command: ./sha.sh lab
    entries:
      # 只声明 app —— 解析器目前只认 app / web 两种 entry（service 会整条被当成坏文件丢掉）
      - kind: app
        title: Electron 窗口

  - id: prod
    title: 生产（prod）
    command: ./sha.sh prod
    entries:
      - kind: app
        title: Electron 窗口
