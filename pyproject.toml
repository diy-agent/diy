[project]
name = "diy-monorepo"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["pkgs-diyui/py-diyui"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.uv.sources]
diyui = { workspace = true }

# PyCharm 等 IDE 支持配置
[tool.pyright]
extraPaths = ["pkgs-diyui/py-diyui/src"]

[tool.pytest.ini_options]
pythonpath = ["pkgs-diyui/py-diyui/src"]
