[project]
name = "diy-mono"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "diy-cli",
    "diy-app",
    "diy-ui",
    "hypercorn[h2]>=0.18.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "mistune>=3.2.1",
    "diy-test",
]

[tool.uv]
package = false
# `uv python install`的不是官网文件，而是这个项目打包的便携版: https://github.com/astral-sh/python-build-standalone/
python-install-mirror = "https://registry.npmmirror.com/-/binary/python-build-standalone/"

[tool.uv.workspace]
members = [
    "pkgs/diy-core",
    "pkgs/diy-app",
    "pkgs/diy-cli",
    "pkgs/diy-ui",
    "pkgs/diy-test",
    "pkgs/diy-clirpc",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.uv.sources]
diy-core = { workspace = true }
diy-app = { workspace = true }
diy-cli = { workspace = true }
diy-ui = { workspace = true }
diy-test = { workspace = true }

# ========== Ruff 配置 ==========
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["pkgs/diy-ui/src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
]
ignore = [
    "E501",    # line too long (交给 formatter 处理)
    "B008",    # function call in default argument
    "TC003",   # stdlib import into type-checking block (运行时需要)
    "UP046",   # Generic subclass (兼容旧写法)
]

[tool.ruff.lint.isort]
known-first-party = ["diy.ui"]

[tool.ruff.lint.per-file-ignores]
"pkgs/diy-ui/tests/test_panel_param_coverage.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ========== Pyright 配置 ==========
[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = [
    "tests",
    "pkgs/*/src",
    "pkgs/*/tests",
    "pkgs/*/demo",
    "pkgs/*/examples",
    "pkgs/*/tools",
]
# extraPaths = ["pkgs/diy-ui/tools"]
reportMissingParameterType = true
reportUnknownParameterType = true
reportIncompatibleMethodOverride = false

# ========== Pytest 配置 ==========
[tool.pytest.ini_options]
markers = ["browser: 需要 headless browser 的测试"]
testpaths = [
    "tests",
    "pkgs/diy-cli/tests",
    "pkgs/diy-ui/tests",
]
